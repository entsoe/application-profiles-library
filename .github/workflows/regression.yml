name: SHACL Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: validate/regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validate/regression/requirements.txt

      - name: Install dependencies
        run: pip install -r validate/regression/requirements.txt

      - name: Run regression suite
        working-directory: validate
        run: python -m unittest discover -s regression -t regression -v
